services:
  postgres:
    image: postgres:16
    container_name: tgbot_postgres
    environment:
      POSTGRES_DB: telegrambot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  telegram-bot:
    build: .
    container_name: telegram-bot
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/telegrambot
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      YANDEX_MUSIC_TOKEN: ${YANDEX_MUSIC_TOKEN}
      DOWNLOAD_YT_DLP_COOKIES_FILE: ${DOWNLOAD_YT_DLP_COOKIES_FILE:-}
    volumes:
      - ./downloads:/app/downloads
      - ./cookies:/app/cookies
    restart: always
volumes:
  pgdata: