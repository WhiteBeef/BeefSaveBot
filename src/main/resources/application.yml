# веб (REST API для интеграций) включает BeefSaveBotApplication, когда задан API_KEY; свойство
# spring.main.web-application-type здесь не задаём — оно перебило бы этот выбор
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}
    # Telegram ID единственного администратора (узнать свой ID можно у @userinfobot)
    admin-id: ${TELEGRAM_ADMIN_ID:}
    # Чат для загрузки видео в инлайн-режиме (по умолчанию — чат админа, сообщения сразу удаляются)
    storage-chat-id: ${TELEGRAM_STORAGE_CHAT_ID:}
    author: ${TELEGRAM_BOT_AUTHOR:@WhiteBeef}
    github-url: ${TELEGRAM_BOT_GITHUB_URL:https://github.com/WhiteBeef/BeefSaveBot}
    timezone: ${BOT_TIMEZONE:Europe/Moscow}

download:
  max-bytes: ${DOWNLOAD_MAX_BYTES:52428800}
  source-max-bytes: ${DOWNLOAD_SOURCE_MAX_BYTES:524288000}
  ffmpeg-timeout-minutes: ${DOWNLOAD_FFMPEG_TIMEOUT_MINUTES:15}
  # Кэш file_id отправленных файлов: повторный запрос той же ссылки отдаётся мгновенно
  cache-enabled: ${DOWNLOAD_CACHE_ENABLED:true}
  # Срок жизни записи кэша в часах, 0 — бессрочно (файлы хранятся в Telegram, не на диске)
  cache-hours: ${DOWNLOAD_CACHE_HOURS:0}
  max-height: ${DOWNLOAD_MAX_HEIGHT:1080}
  max-resolution: ${DOWNLOAD_MAX_RESOLUTION:1080}
  yt-dlp:
    user-agent: ${DOWNLOAD_YT_DLP_USER_AGENT:}
    cookies-file: ${DOWNLOAD_YT_DLP_COOKIES_FILE:}
    python: ${DOWNLOAD_YT_DLP_PYTHON:}
  slideshow:
    seconds-per-slide: ${DOWNLOAD_SLIDESHOW_SECONDS_PER_SLIDE:3}
    # Запасной сторонний API (tikwm.com), если страницу TikTok разобрать не удалось
    fallback-api-enabled: ${DOWNLOAD_SLIDESHOW_FALLBACK_API:true}
  yandex-music:
    token: ${YANDEX_MUSIC_TOKEN:}

logging:
  level:
    sql: debug

# REST API (/api/v1, заголовок X-Api-Key): см. README → «API для интеграций»
server:
  port: ${API_PORT:8090}
  address: ${API_ADDRESS:0.0.0.0}
api:
  key: ${API_KEY:}
  # файл в ответе (deliver=inline) — не больше; крупнее — только в Telegram
  inline-max-bytes: ${API_INLINE_MAX_BYTES:4194304}
